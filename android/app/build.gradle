plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new java.util.Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new java.io.FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.heudev.bananaescape"
    // Tracks the Flutter SDK so target API bumps arrive with the toolchain
    // instead of needing a manual edit before every Play deadline.
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }


    defaultConfig {
        applicationId = "com.heudev.bananaescape"
        // Tracking the Flutter SDK here too, for the same reason as above.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = keystoreProperties["storeFile"] ? rootProject.file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

// The keystore check used to live inline above, inside `buildTypes { release
// { ... } }`. That closure configures eagerly during Gradle's configuration
// phase for every invocation, not only when a release variant is actually
// built — so `flutter build apk --debug` (and CI, and anyone cloning the repo
// without the private keystore) failed before a single task ran. Deferred to
// task-graph time so only actually assembling or bundling the release variant
// demands a real keystore.
gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any { it.name.endsWith("Release") }
    if (buildsRelease && !keystorePropertiesFile.exists()) {
        throw new GradleException("Missing android/key.properties. Create a real upload keystore before building a Play Store release.")
    }
}

// Kotlin 2.x replaced the old `kotlinOptions` block with this one.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}
